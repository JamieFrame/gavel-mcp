# VZ10 row M1, G5 — mcp-testnet.thegavel.io → the gavel-testnet unit on loopback (__PORT__, set by apply.sh nginx).
# Plain HTTP as installed; apply.sh tls runs certbot --nginx, which adds the 443 server and the redirect.
# The app trusts X-Forwarded-For from loopback only (src/http.ts), so the per-caller rate limit sees the client.
server {
    listen 80;
    listen [::]:80;
    server_name mcp-testnet.thegavel.io;

    access_log /var/log/nginx/mcp-testnet.access.log;
    error_log  /var/log/nginx/mcp-testnet.error.log;

    client_max_body_size 300k;

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # Streamable HTTP answers may stream (text/event-stream): no buffering, long reads.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
