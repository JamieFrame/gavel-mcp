# /etc/nginx/sites-available/mcp.thegavel.io
#
# Reverse proxy to the local Aletheia MCP server (Node on 127.0.0.1:3002).
# Symlink into sites-enabled/ then `nginx -t && systemctl reload nginx`.
#
# TLS termination should be handled by certbot (Let's Encrypt) the same way
# api.thegavel.io is set up. Run:
#   certbot --nginx -d mcp.thegavel.io
# after first creating this server block (certbot will add the SSL bits in
# place).

server {
    listen 80;
    listen [::]:80;
    server_name mcp.thegavel.io;

    # Certbot will rewrite this block to redirect to HTTPS on first issuance.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mcp.thegavel.io;

    # TLS — paths set by certbot
    # ssl_certificate     /etc/letsencrypt/live/mcp.thegavel.io/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/mcp.thegavel.io/privkey.pem;

    # Sensible defaults
    client_max_body_size 256k;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;

    # Health check (no auth, light response — useful for uptime monitors)
    location /health {
        proxy_pass http://127.0.0.1:3002/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MCP RPC endpoint
    location /mcp {
        proxy_pass http://127.0.0.1:3002/mcp;
        proxy_http_version 1.1;

        # Forward client identity so the MCP server's `trust proxy` resolves
        # the real IP for anonymous rate-limiting buckets.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streamable HTTP transport may keep the connection open for streaming
        # responses — disable nginx buffering so chunks reach the client
        # promptly.
        proxy_buffering off;
        proxy_cache off;

        # MCP responses are typically small JSON, but server tools can be
        # slower than 30s if upstream is degraded; bump just for /mcp.
        proxy_read_timeout 60s;
    }

    # Everything else → 404 (no static content here)
    location / {
        return 404;
    }

    access_log /var/log/nginx/mcp.thegavel.io.access.log;
    error_log  /var/log/nginx/mcp.thegavel.io.error.log;
}
